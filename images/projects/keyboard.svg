<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Split keyboard half: a 5 by 6 key matrix and 16 RGB LEDs driven by two cascaded TLC5947 chips from an ATmega32U4, with USB HID out and a UART link to the other half">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01324F"/>
      <stop offset="1" stop-color="#0A1A2F"/>
    </linearGradient>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#0077B6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <g transform="translate(0 14)">

    <!-- 5 x 6 key matrix, hue sweeping across the board -->
    <g stroke="#0096C7" stroke-opacity="0.55" stroke-width="1.2">
      <rect x="72" y="52" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.30"/><rect x="112" y="52" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.24"/><rect x="152" y="52" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.26"/><rect x="192" y="52" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.22"/><rect x="232" y="52" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.30"/><rect x="272" y="52" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.24"/>
      <rect x="72" y="88" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.24"/><rect x="112" y="88" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.18"/><rect x="152" y="88" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.20"/><rect x="192" y="88" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.16"/><rect x="232" y="88" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.24"/><rect x="272" y="88" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.18"/>
      <rect x="72" y="124" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.22"/><rect x="112" y="124" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.16"/><rect x="152" y="124" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.20"/><rect x="192" y="124" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.16"/><rect x="232" y="124" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.20"/><rect x="272" y="124" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.22"/>
      <rect x="72" y="160" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.18"/><rect x="112" y="160" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.14"/><rect x="152" y="160" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.16"/><rect x="192" y="160" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.22"/><rect x="232" y="160" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.18"/><rect x="272" y="160" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.16"/>
      <rect x="72" y="196" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.24"/><rect x="112" y="196" width="34" height="26" rx="4" fill="#0077B6" fill-opacity="0.18"/><rect x="152" y="196" width="34" height="26" rx="4" fill="#0096C7" fill-opacity="0.16"/><rect x="192" y="196" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.20"/><rect x="232" y="196" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.26"/><rect x="272" y="196" width="34" height="26" rx="4" fill="#4CC9E8" fill-opacity="0.20"/>
    </g>
    <text x="72" y="248" font-family="'JetBrains Mono',monospace" font-size="12" fill="#0096C7" fill-opacity="0.75">5 x 6 matrix · 30 diodes</text>

    <!-- rows and columns gathered into 11 pins -->
    <g fill="none" stroke="#0096C7" stroke-width="1.4" stroke-opacity="0.6">
      <path d="M312 65 H 340 V 130 H 344"/>
      <path d="M312 101 H 336 V 140 H 344"/>
      <path d="M312 137 H 332 V 150 H 344"/>
      <path d="M312 173 H 336 V 160 H 344"/>
      <path d="M312 209 H 340 V 170 H 344"/>
    </g>
    <text x="322" y="266" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0096C7" fill-opacity="0.6">11 pins</text>

    <!-- MCU -->
    <rect x="344" y="112" width="116" height="76" rx="6" fill="#0077B6" fill-opacity="0.18" stroke="#0096C7" stroke-width="1.6"/>
    <text x="402" y="146" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.9">ATmega32U4</text>
    <text x="402" y="164" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0096C7" fill-opacity="0.75">16 MHz · USB HID</text>

    <!-- two cascaded LED drivers -->
    <g stroke="#4CC9E8" stroke-width="1.5" fill="#4CC9E8" fill-opacity="0.10">
      <rect x="500" y="72" width="96" height="42" rx="6"/>
      <rect x="500" y="186" width="96" height="42" rx="6"/>
    </g>
    <text x="548" y="98" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4CC9E8">TLC5947</text>
    <text x="548" y="212" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4CC9E8">TLC5947</text>
    <path d="M548 114 V 186" fill="none" stroke="#4CC9E8" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M544 180 L548 188 L552 180" fill="none" stroke="#4CC9E8" stroke-width="1.4" stroke-opacity="0.7"/>
    <text x="556" y="156" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.8">SOUT</text>

    <!-- MCU to drivers: 576 bits -->
    <path d="M460 130 H 478 V 93 H 500" fill="none" stroke="#4CC9E8" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M494 97 L 500 93 L 494 89" fill="none" stroke="#4CC9E8" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="424" y="84" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.8">576 bits</text>

    <!-- 48 PWM channels back up to the LEDs -->
    <path d="M596 93 H 620 V 26 H 152 V 46" fill="none" stroke="#4CC9E8" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="4 4"/>
    <text x="196" y="20" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.65">48 channels · 12-bit PWM</text>

    <!-- USB out -->
    <g stroke="#fff" stroke-opacity="0.55" stroke-width="1.3" fill="none">
      <rect x="72" y="286" width="30" height="16" rx="2"/>
      <path d="M102 294 H 128"/>
    </g>
    <text x="138" y="298" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.7">USB to host</text>

    <!-- UART to the other half -->
    <circle cx="330" cy="294" r="8" fill="none" stroke="#0096C7" stroke-width="1.4" stroke-opacity="0.8"/>
    <path d="M338 294 H 396" fill="none" stroke="#0096C7" stroke-width="1.4" stroke-opacity="0.8" stroke-dasharray="5 4"/>
    <text x="406" y="298" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0096C7" fill-opacity="0.75">UART to the other half</text>
    <text x="306" y="320" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0096C7" fill-opacity="0.55">3.5 mm jack</text>
  </g>
</svg>
