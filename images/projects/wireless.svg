<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Two paths to the kernel: on the left the wifi module forks and execs iw and ip, on the right it sends nl80211 and rtnetlink messages over one socket">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01324F"/>
      <stop offset="1" stop-color="#0A1A2F"/>
    </linearGradient>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#0077B6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <g transform="translate(0 14)">

    <!-- before -->
    <text x="70" y="34" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.45">before</text>
    <rect x="110" y="44" width="120" height="34" rx="6" fill="#0077B6" fill-opacity="0.18" stroke="#0096C7" stroke-width="1.6"/>
    <text x="170" y="66" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.9">lili-wifi</text>

    <g fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.3">
      <path d="M140 78 V 98 H 120 V 104"/>
      <path d="M116 100 L120 108 L124 100"/>
      <path d="M200 78 V 98 H 240 V 104"/>
      <path d="M236 100 L240 108 L244 100"/>
    </g>
    <text x="246" y="90" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.6">fork + exec</text>

    <g stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" fill="#fff" fill-opacity="0.06">
      <rect x="80" y="112" width="80" height="38" rx="5"/>
      <rect x="200" y="112" width="80" height="38" rx="5"/>
    </g>
    <text x="120" y="130" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.75">iw</text>
    <text x="120" y="144" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">channel · phy</text>
    <text x="240" y="130" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.75">ip</text>
    <text x="240" y="144" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fff" fill-opacity="0.45">link up/down</text>

    <g fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.2">
      <path d="M120 150 V 166"/><path d="M116 162 L120 170 L124 162"/>
      <path d="M240 150 V 166"/><path d="M236 162 L240 170 L244 162"/>
    </g>

    <rect x="70" y="172" width="200" height="34" rx="6" fill="#0077B6" fill-opacity="0.14" stroke="#0096C7" stroke-width="1.4" stroke-opacity="0.7"/>
    <text x="170" y="194" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.85">kernel</text>

    <text x="70" y="230" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">5 execlp sites</text>
    <text x="70" y="246" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.4">one per channel switch, every 4 s</text>

    <!-- after -->
    <text x="370" y="34" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4CC9E8" fill-opacity="0.6">after</text>
    <rect x="410" y="44" width="120" height="34" rx="6" fill="#0077B6" fill-opacity="0.18" stroke="#4CC9E8" stroke-width="1.6"/>
    <text x="470" y="66" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.9">lili-wifi</text>

    <g fill="none" stroke="#4CC9E8" stroke-width="1.4" stroke-opacity="0.8">
      <path d="M440 78 V 98 H 410 V 106"/>
      <path d="M406 102 L410 110 L414 102"/>
      <path d="M500 78 V 98 H 530 V 106"/>
      <path d="M526 102 L530 110 L534 102"/>
    </g>
    <text x="546" y="90" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.75">one socket</text>

    <g stroke="#4CC9E8" stroke-width="1.4" fill="#4CC9E8" fill-opacity="0.10">
      <rect x="360" y="110" width="100" height="30" rx="5"/>
      <rect x="480" y="110" width="100" height="30" rx="5"/>
    </g>
    <text x="410" y="129" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4CC9E8">nl80211</text>
    <text x="530" y="129" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4CC9E8">rtnetlink</text>

    <g fill="none" stroke="#4CC9E8" stroke-width="1.3" stroke-opacity="0.7">
      <path d="M410 140 V 168"/><path d="M406 164 L410 172 L414 164"/>
      <path d="M530 140 V 168"/><path d="M526 164 L530 172 L534 164"/>
    </g>

    <rect x="370" y="172" width="200" height="34" rx="6" fill="#0077B6" fill-opacity="0.14" stroke="#4CC9E8" stroke-width="1.4" stroke-opacity="0.7"/>
    <text x="470" y="194" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.85">kernel</text>

    <text x="370" y="230" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.7">5 commands, 1 socket</text>
    <text x="370" y="246" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.55">no subprocess in the hop loop</text>

    <!-- the five commands, as a small ledger along the bottom -->
    <g font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.55">
      <text x="70" y="292">GET_INTERFACE</text>
      <text x="196" y="292">GET_WIPHY</text>
      <text x="300" y="292">NEW_INTERFACE</text>
      <text x="430" y="292">DEL_INTERFACE</text>
      <text x="556" y="292">SET_WIPHY</text>
    </g>
    <g stroke="#0096C7" stroke-opacity="0.35" stroke-width="1">
      <path d="M70 300 H 612"/>
    </g>
    <text x="70" y="318" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0096C7" fill-opacity="0.6">the five nl80211 commands the module sends</text>
  </g>
</svg>
