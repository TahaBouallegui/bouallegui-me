<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Three devices on a tailnet reaching a headless server called aleph, which runs immich, jellyfin, grocy, searxng, samba and a local llm. An arrow from the public internet is crossed out: no port is open to the outside world">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#01324F"/>
      <stop offset="1" stop-color="#0A1A2F"/>
    </linearGradient>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#0077B6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <g transform="translate(0 14)">

    <!-- the tailnet boundary -->
    <rect x="252" y="42" width="358" height="248" rx="14" fill="#0096C7" fill-opacity="0.05" stroke="#0096C7" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text x="268" y="66" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4CC9E8" fill-opacity="0.85">tailnet</text>

    <!-- peers -->
    <g fill="#0077B6">
      <circle cx="62" cy="96" r="8"/><circle cx="62" cy="166" r="8"/><circle cx="62" cy="236" r="8"/>
    </g>
    <text x="86" y="88" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.85">phone</text>
    <text x="86" y="158" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.85">laptop</text>
    <text x="86" y="228" font-family="'JetBrains Mono',monospace" font-size="12" fill="#fff" fill-opacity="0.85">someone who asked</text>

    <!-- links, each one crossing the boundary -->
    <g fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3">
      <path d="M70 96 H 210 V 128 H 292"/>
      <path d="M288 124 L296 128 L288 132"/>
      <path d="M70 166 H 292"/>
      <path d="M288 162 L296 166 L288 170"/>
      <path d="M70 236 H 210 V 204 H 292"/>
      <path d="M288 200 L296 204 L288 208"/>
    </g>
    <text x="196" y="86" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.5">wireguard</text>

    <!-- the server -->
    <rect x="300" y="84" width="286" height="188" rx="8" fill="#0077B6" fill-opacity="0.18" stroke="#0096C7" stroke-width="1.6"/>
    <text x="316" y="106" font-family="'JetBrains Mono',monospace" font-size="13" fill="#fff" fill-opacity="0.92">aleph</text>
    <text x="360" y="106" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.45">headless, no display</text>

    <g stroke="#0096C7" stroke-opacity="0.5" stroke-width="1.1" fill="#fff" fill-opacity="0.06">
      <rect x="316" y="120" width="78" height="26" rx="4"/>
      <rect x="404" y="120" width="78" height="26" rx="4"/>
      <rect x="492" y="120" width="78" height="26" rx="4"/>
      <rect x="316" y="154" width="78" height="26" rx="4"/>
      <rect x="404" y="154" width="78" height="26" rx="4"/>
      <rect x="492" y="154" width="78" height="26" rx="4"/>
    </g>
    <g font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.8" text-anchor="middle">
      <text x="355" y="137">immich</text>
      <text x="443" y="137">jellyfin</text>
      <text x="531" y="137">grocy</text>
      <text x="355" y="171">searxng</text>
      <text x="443" y="171">samba</text>
      <text x="531" y="171">llm</text>
    </g>

    <text x="316" y="212" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.8">openFirewall = false</text>
    <text x="316" y="228" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4CC9E8" fill-opacity="0.6">trustedInterfaces = [ "tailscale0" ]</text>
    <text x="316" y="252" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.45">one OpenAI-compatible endpoint</text>

    <!-- nothing comes in from outside -->
    <text x="64" y="318" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff" fill-opacity="0.4">internet</text>
    <g fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.3">
      <path d="M130 314 H 208"/>
      <path d="M204 310 L212 314 L204 318"/>
    </g>
    <g stroke="#fff" stroke-opacity="0.55" stroke-width="1.6">
      <circle cx="174" cy="314" r="13" fill="none"/>
      <path d="M165 323 L183 305"/>
    </g>
    <text x="232" y="318" font-family="'JetBrains Mono',monospace" font-size="10" fill="#fff" fill-opacity="0.4">no port, no cert, no login page</text>
  </g>
</svg>
